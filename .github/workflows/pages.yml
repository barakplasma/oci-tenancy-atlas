name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No bundler: the site is index.html plus the vendored renderer. Fail fast if either won't parse.
      - name: Check scripts parse
        run: |
          node --check vendor/ondine-0.0.3.js
          node -e '
            const html = require("fs").readFileSync("index.html", "utf8");
            const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
            if (!scripts.length) throw new Error("no inline script found");
            scripts.forEach((s, i) => new Function(s));
            console.log(`parsed ${scripts.length} inline script(s)`);
          '
      - name: Assemble site
        run: |
          mkdir -p _site/vendor
          cp index.html _site/
          cp vendor/ondine-0.0.3.js _site/vendor/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
